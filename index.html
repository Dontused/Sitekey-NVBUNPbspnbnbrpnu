<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sitekey</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #111;
            color: white;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .arquivo {
            background: #1d1d1d;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .nome {
            font-size: 17px;
            word-break: break-word;
        }

        .botoes {
            display: flex;
            gap: 8px;
        }

        button,
        a {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .download {
            background: #2563eb;
            color: white;
        }

        .delete {
            background: #dc2626;
            color: white;
        }

        .update {
            margin-top: 15px;
            width: 100%;
            background: #16a34a;
            color: white;
            padding: 13px;
        }

        button:hover,
        a:hover {
            opacity: 0.85;
        }

        #mensagem {
            margin-top: 15px;
            padding: 12px;
            background: #1d1d1d;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Sitekey</h1>

    <div class="arquivo">

        <div class="nome">
            📄 config_te.txt
        </div>

        <div class="botoes">

            <a
                href="/download"
                class="download">
                Download
            </a>

            <button
                class="delete"
                onclick="deletarArquivo()">
                Delete
            </button>

        </div>

    </div>

    <button
        class="update"
        onclick="atualizarArquivo()">
        🔄 Update file
    </button>

    <div id="mensagem"></div>

</div>


<script>

function mostrarMensagem(texto) {

    const mensagem = document.getElementById("mensagem");

    mensagem.innerText = texto;
    mensagem.style.display = "block";

}


async function deletarArquivo() {

    if (!confirm("Deseja realmente excluir o arquivo?")) {
        return;
    }

    const resposta = await fetch("/delete", {
        method: "POST"
    });

    const dados = await resposta.json();

    mostrarMensagem(dados.mensagem);

}


async function atualizarArquivo() {

    mostrarMensagem("Solicitando arquivo atualizado...");

    /*
        Aqui será feita a comunicação com
        o computador secundário.
    */

    const resposta = await fetch("/update", {
        method: "POST"
    });

    const dados = await resposta.json();

    mostrarMensagem(dados.mensagem);

}

</script>

</body>
</html>
