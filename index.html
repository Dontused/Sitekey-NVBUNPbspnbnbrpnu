<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sitekey</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f2f2f2;
            min-height: 100vh;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 25px;
        }

        .titulo h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .titulo p {
            color: #666;
            font-size: 15px;
        }

        .status {
            background: white;
            border-radius: 15px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .bolinha {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #999;
        }

        .online {
            background: #18a558;
        }

        .offline {
            background: #e53935;
        }

        .acoes {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .botao-atualizar {
            border: none;
            background: #0058a8;
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .botao-atualizar:hover {
            background: #004582;
        }

        .botao-atualizar:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .painel {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .painel h2 {
            font-size: 21px;
            margin-bottom: 18px;
        }

        .arquivo {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .arquivo-info {
            flex: 1;
        }

        .arquivo-nome {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .arquivo-data {
            color: #666;
            font-size: 14px;
        }

        .arquivo-acoes {
            display: flex;
            gap: 8px;
        }

        .botao {
            border: none;
            border-radius: 8px;
            padding: 9px 13px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 14px;
        }

        .botao-baixar {
            background: #0058a8;
            color: white;
        }

        .botao-baixar:hover {
            background: #004582;
        }

        .botao-excluir {
            background: #e53935;
            color: white;
        }

        .botao-excluir:hover {
            background: #c62828;
        }

        .vazio {
            text-align: center;
            color: #777;
            padding: 30px 10px;
        }

        .mensagem {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #555;
            min-height: 20px;
        }

        @media (max-width: 600px) {

            .container {
                padding: 20px 12px;
            }

            .titulo h1 {
                font-size: 27px;
            }

            .arquivo {
                flex-direction: column;
                align-items: stretch;
            }

            .arquivo-acoes {
                width: 100%;
            }

            .botao {
                flex: 1;
                text-align: center;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="titulo">

            <h1>Sitekey</h1>

            <p>
                Gerenciamento de arquivos
            </p>

        </div>


        <!-- STATUS DO PC -->

        <div class="status">

            <div
                id="bolinha"
                class="bolinha"
            ></div>

            <span id="statusTexto">
                Verificando PC secundário...
            </span>

        </div>


        <!-- BOTÃO DE ATUALIZAÇÃO -->

        <div class="acoes">

            <button
                id="botaoAtualizar"
                class="botao-atualizar"
                onclick="solicitarAtualizacao()"
            >
                Atualizar agora
            </button>

        </div>


        <!-- LISTA DE ARQUIVOS -->

        <div class="painel">

            <h2>
                Arquivos recebidos
            </h2>

            <div id="listaArquivos">

                <div class="vazio">
                    Carregando arquivos...
                </div>

            </div>

        </div>


        <div
            id="mensagem"
            class="mensagem"
        ></div>

    </div>


    <script>

        // ==================================================
        // ENDEREÇO DO SERVIDOR
        // ==================================================

        const SERVER_URL =
            "https://sitekey-nvbunpbspnbnbrpnu.onrender.com";


        // ==================================================
        // ELEMENTOS DA PÁGINA
        // ==================================================

        const listaArquivos =
            document.getElementById(
                "listaArquivos"
            );

        const statusTexto =
            document.getElementById(
                "statusTexto"
            );

        const bolinha =
            document.getElementById(
                "bolinha"
            );

        const mensagem =
            document.getElementById(
                "mensagem"
            );

        const botaoAtualizar =
            document.getElementById(
                "botaoAtualizar"
            );


        // ==================================================
        // VERIFICAR STATUS DO PC SECUNDÁRIO
        // ==================================================

        function verificarServidor() {

            fetch(
                SERVER_URL + "/pc_status"
            )

            .then(
                resposta =>
                    resposta.json()
            )

            .then(
                dados => {

                    if (dados.online) {

                        bolinha.className =
                            "bolinha online";

                        statusTexto.textContent =
                            "🟢 PC secundário: ONLINE";

                    } else {

                        bolinha.className =
                            "bolinha offline";

                        statusTexto.textContent =
                            "🔴 PC secundário: OFFLINE";

                    }

                }
            )

            .catch(
                erro => {

                    bolinha.className =
                        "bolinha offline";

                    statusTexto.textContent =
                        "🔴 PC secundário: OFFLINE";

                }
            );

        }


        // ==================================================
        // CARREGAR ARQUIVOS
        // ==================================================

        function carregarArquivos() {

            fetch(
                SERVER_URL + "/arquivos"
            )

            .then(
                resposta =>
                    resposta.json()
            )

            .then(
                dados => {

                    listaArquivos.innerHTML =
                        "";

                    if (
                        !dados.sucesso ||
                        dados.arquivos.length === 0
                    ) {

                        listaArquivos.innerHTML = `
                            <div class="vazio">
                                Nenhum arquivo recebido.
                            </div>
                        `;

                        return;
                    }


                    dados.arquivos.forEach(
                        arquivo => {

                            const elemento =
                                document.createElement(
                                    "div"
                                );

                            elemento.className =
                                "arquivo";


                            elemento.innerHTML = `

                                <div class="arquivo-info">

                                    <div class="arquivo-nome">
                                        ${arquivo.nome}
                                    </div>

                                    <div class="arquivo-data">
                                        ${arquivo.data}
                                        às
                                        ${arquivo.hora}
                                    </div>

                                </div>


                                <div class="arquivo-acoes">

                                    <a
                                        class="botao botao-baixar"
                                        href="${SERVER_URL}/baixar/${encodeURIComponent(arquivo.id)}"
                                        target="_blank"
                                    >
                                        Baixar
                                    </a>


                                    <button
                                        class="botao botao-excluir"
                                        onclick="excluirArquivo('${encodeURIComponent(arquivo.id)}')"
                                    >
                                        Excluir
                                    </button>

                                </div>

                            `;


                            listaArquivos.appendChild(
                                elemento
                            );

                        }
                    );

                }
            )

            .catch(
                erro => {

                    listaArquivos.innerHTML = `

                        <div class="vazio">
                            Erro ao carregar os arquivos.
                        </div>

                    `;

                }
            );

        }


        // ==================================================
        // SOLICITAR ATUALIZAÇÃO
        // ==================================================

        function solicitarAtualizacao() {

            botaoAtualizar.disabled =
                true;

            botaoAtualizar.textContent =
                "Enviando pedido...";


            fetch(
                SERVER_URL + "/atualizar",
                {
                    method: "POST"
                }
            )

            .then(
                resposta =>
                    resposta.json()
            )

            .then(
                dados => {

                    if (dados.sucesso) {

                        mensagem.textContent =
                            "Pedido de atualização enviado.";

                    } else {

                        mensagem.textContent =
                            "Erro ao solicitar atualização.";

                    }

                }
            )

            .catch(
                erro => {

                    mensagem.textContent =
                        "Erro de conexão com o servidor.";

                }
            )

            .finally(
                () => {

                    botaoAtualizar.disabled =
                        false;

                    botaoAtualizar.textContent =
                        "Atualizar agora";

                }
            );

        }


        // ==================================================
        // EXCLUIR ARQUIVO
        // ==================================================

        function excluirArquivo(nome) {

            // ==============================================
            // CONFIRMAÇÃO
            // ==============================================

            const confirmar = confirm(
                "Tem certeza que deseja excluir este arquivo?"
            );


            // ==============================================
            // SE CLICAR EM CANCELAR
            // ==============================================

            if (!confirmar) {

                return;

            }


            // ==============================================
            // ENVIAR PEDIDO PARA O SERVIDOR
            // ==============================================

            fetch(

                SERVER_URL
                + "/excluir/"
                + nome,

                {
                    method: "DELETE"
                }

            )

            .then(
                resposta =>
                    resposta.json()
            )

            .then(
                dados => {

                    if (dados.sucesso) {

                        mensagem.textContent =
                            "Arquivo excluído com sucesso.";

                        carregarArquivos();

                    } else {

                        mensagem.textContent =
                            "Erro ao excluir: "
                            + dados.erro;

                    }

                }
            )

            .catch(
                erro => {

                    mensagem.textContent =
                        "Erro de conexão com o servidor.";

                    console.error(
                        erro
                    );

                }
            );

        }


        // ==================================================
        // INICIAR
        // ==================================================

        verificarServidor();

        carregarArquivos();


        // ==================================================
        // ATUALIZAR STATUS A CADA 5 SEGUNDOS
        // ==================================================

        setInterval(
            verificarServidor,
            5000
        );


        // ==================================================
        // ATUALIZAR LISTA A CADA 5 SEGUNDOS
        // ==================================================

        setInterval(
            carregarArquivos,
            5000
        );

    </script>

</body>

</html>
