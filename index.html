<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sitekey</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f2f2f2;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .painel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .bolinha {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #888;
        }

        .online {
            background: #20b455;
        }

        .offline {
            background: #d33;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .atualizar {
            background: #1769e0;
            color: white;
        }

        .atualizar:hover {
            background: #0f55bb;
        }

        .arquivo {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .informacoes {
            flex: 1;
        }

        .nome {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .data {
            color: #777;
            font-size: 14px;
        }

        .acoes {
            display: flex;
            gap: 8px;
        }

        .baixar {
            background: #20a464;
            color: white;
        }

        .excluir {
            background: #d93636;
            color: white;
        }

        .mensagem {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .arquivo {
                flex-direction: column;
                align-items: stretch;
            }

            .acoes {
                width: 100%;
            }

            .acoes button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Sitekey</h1>

    <p class="subtitulo">
        Gerenciamento de arquivos
    </p>

    <div class="painel">

        <div class="status">
            <div id="bolinha" class="bolinha"></div>
            <span id="statusTexto">Verificando PC secundário...</span>
        </div>

        <div class="botoes">
            <button class="atualizar" onclick="solicitarAtualizacao()">
                🔄 Atualizar arquivo
            </button>
        </div>

        <div id="lista">
            <div class="mensagem">
                Carregando arquivos...
            </div>
        </div>

    </div>

</div>

<script>

    /*
       URL DO SEU RENDER
    */

    const SERVIDOR = "https://sitekey-nvbunpbspnbnbrpnu.onrender.com";


    // =========================================================
    // VERIFICAR PC SECUNDÁRIO
    // =========================================================

    async function verificarServidor() {

        try {

            const resposta =
                await fetch(SERVIDOR + "/pc_status");

            if (!resposta.ok) {
                throw new Error("Erro ao verificar PC");
            }

            const dados = await resposta.json();

            const bolinha =
                document.getElementById("bolinha");

            const statusTexto =
                document.getElementById("statusTexto");


            if (dados.online) {

                bolinha.className =
                    "bolinha online";

                statusTexto.textContent =
                    "🟢 PC secundário: ONLINE";

            } else {

                bolinha.className =
                    "bolinha offline";

                statusTexto.textContent =
                    "🔴 PC secundário: OFFLINE";

            }

        } catch (erro) {

            document.getElementById("bolinha").className =
                "bolinha offline";

            document.getElementById("statusTexto").textContent =
                "🔴 PC secundário: OFFLINE";

        }
    }


    // =========================================================
    // LISTAR ARQUIVOS
    // =========================================================

    async function carregarArquivos() {

        const lista = document.getElementById("lista");

        try {

            const resposta =
                await fetch(SERVIDOR + "/arquivos");

            if (!resposta.ok) {
                throw new Error("Erro");
            }

            const dados = await resposta.json();

            // Monta a nova lista sem apagar a atual.
            const novaLista = document.createDocumentFragment();

            if (!dados.arquivos || dados.arquivos.length === 0) {

                const mensagem = document.createElement("div");
                mensagem.className = "mensagem";
                mensagem.textContent = "Nenhum arquivo recebido ainda.";
                novaLista.appendChild(mensagem);

            } else {

                dados.arquivos.forEach(arquivo => {

                    const div = document.createElement("div");
                    div.className = "arquivo";

                    const informacoes = document.createElement("div");
                    informacoes.className = "informacoes";

                    const nome = document.createElement("div");
                    nome.className = "nome";
                    nome.textContent = "📄 " + arquivo.nome;

                    const data = document.createElement("div");
                    data.className = "data";
                    data.textContent =
                        "Enviado em " + arquivo.data +
                        " às " + arquivo.hora;

                    informacoes.appendChild(nome);
                    informacoes.appendChild(data);

                    const acoes = document.createElement("div");
                    acoes.className = "acoes";

                    const baixar = document.createElement("button");
                    baixar.className = "baixar";
                    baixar.textContent = "Baixar";
                    baixar.onclick = () =>
                        baixarArquivo(encodeURIComponent(arquivo.id));

                    const excluir = document.createElement("button");
                    excluir.className = "excluir";
                    excluir.textContent = "Excluir";
                    excluir.onclick = () =>
                        excluirArquivo(encodeURIComponent(arquivo.id));

                    acoes.appendChild(baixar);
                    acoes.appendChild(excluir);

                    div.appendChild(informacoes);
                    div.appendChild(acoes);
                    novaLista.appendChild(div);
                });
            }

            // Substitui tudo de uma vez, sem deixar a tela vazia.
            lista.replaceChildren(novaLista);

        } catch (erro) {

            // Mantém os arquivos atuais se o servidor falhar temporariamente.
            if (!lista.children.length) {
                const mensagem = document.createElement("div");
                mensagem.className = "mensagem";
                mensagem.textContent =
                    "Não foi possível carregar os arquivos.";
                lista.appendChild(mensagem);
            }
        }
    }


    // =========================================================
    // SOLICITAR ATUALIZAÇÃO
    // =========================================================

    async function solicitarAtualizacao() {

        try {

            const resposta =
                await fetch(SERVIDOR + "/atualizar", {
                    method: "POST"
                });

            const dados = await resposta.json();

            if (dados.sucesso) {

                alert(
                    "Atualização solicitada!\n\n" +
                    "O computador secundário enviará o config_te.txt."
                );

            } else {

                alert("Não foi possível solicitar a atualização.");
            }

        } catch (erro) {

            alert(
                "Não foi possível conectar ao servidor."
            );
        }
    }


    // =========================================================
    // BAIXAR
    // =========================================================

    function baixarArquivo(nome) {

        window.location.href =
            SERVIDOR + "/baixar/" + nome;
    }


    // =========================================================
    // EXCLUIR
    // =========================================================

    async function excluirArquivo(nome) {

        const confirmar = confirm(
            "Deseja realmente excluir este arquivo?"
        );

        if (!confirmar) {
            return;
        }

        try {

            const resposta =
                await fetch(
                    SERVIDOR + "/excluir/" + nome,
                    {
                        method: "DELETE"
                    }
                );

            const dados = await resposta.json();

            if (dados.sucesso) {

                carregarArquivos();

            } else {

                alert(
                    dados.erro || "Não foi possível excluir."
                );
            }

        } catch (erro) {

            alert(
                "Não foi possível conectar ao servidor."
            );
        }
    }


    // =========================================================
    // INICIALIZAÇÃO
    // =========================================================

    verificarServidor();
    carregarArquivos();

    // Atualiza status e lista a cada 5 segundos.
    // Evita duas atualizações simultâneas.
    let atualizacaoEmAndamento = false;

    setInterval(async () => {

        if (atualizacaoEmAndamento) {
            return;
        }

        atualizacaoEmAndamento = true;

        try {
            await verificarServidor();
            await carregarArquivos();
        } finally {
            atualizacaoEmAndamento = false;
        }

    }, 5000);

</script>

</body>
</html>
